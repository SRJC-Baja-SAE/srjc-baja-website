<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0b0b" />
    <link id="site-favicon" rel="icon" type="image/png" href="/assets/srjc-baja-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Page Not Found | SRJC Baja SAE</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f4f1eb;
        background: #0b0b0b;
        --text: #f4f1eb;
        --muted: #b8b4ad;
        --accent: #e13b3b;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; background: #0b0b0b; color: var(--text); }
      a { color: inherit; }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
      .header {
        height: 74px; display: flex; align-items: center; justify-content: space-between;
        padding: 0 max(24px, calc((100vw - 1180px) / 2)); border-bottom: 1px solid #232323;
      }
      .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
      .brand img { width: 42px; height: 42px; object-fit: contain; }
      .brand span { display: grid; line-height: 1; }
      .brand strong { font-family: Orbitron, Impact, sans-serif; font-size: 0.84rem; letter-spacing: 0.08em; }
      .brand small { margin-top: 5px; color: var(--accent); font-size: 0.66rem; font-weight: 800; letter-spacing: 0.22em; }
      .home-link { color: var(--muted); font-size: 0.84rem; font-weight: 800; text-decoration-thickness: 1px; text-underline-offset: 5px; }
      main { min-height: calc(100vh - 74px); display: grid; place-items: center; padding: 72px 24px; }
      .error { width: min(760px, 100%); border-top: 2px solid var(--accent); padding-top: 34px; }
      .code { margin: 0 0 18px; color: var(--accent); font-size: 0.76rem; font-weight: 900; letter-spacing: 0.18em; text-transform: uppercase; }
      h1 {
        margin: 0; max-width: 680px; font-family: Orbitron, Impact, sans-serif;
        font-size: clamp(3rem, 9vw, 6.5rem); line-height: 0.95; letter-spacing: -0.045em; text-transform: uppercase;
      }
      .error > p:not(.code) { max-width: 560px; margin: 26px 0 0; color: var(--muted); font-size: 1.05rem; line-height: 1.7; }
      .button {
        display: inline-flex; align-items: center; justify-content: center; min-height: 46px;
        margin-top: 32px; padding: 12px 18px; background: var(--accent); color: #0b0b0b;
        font-weight: 900; text-decoration: none;
      }
      .button:hover { filter: brightness(1.08); }
      @media (max-width: 600px) {
        .header { height: 66px; padding-inline: 17px; }
        .brand img { width: 38px; height: 38px; }
        .home-link { display: none; }
        main { min-height: calc(100vh - 66px); padding-inline: 17px; }
      }
    </style>
    <script>
      (() => {
        const firstPathSegment = window.location.pathname.split('/').filter(Boolean)[0];
        const siteBase = window.location.hostname.endsWith('.github.io') && firstPathSegment
          ? `/${firstPathSegment}/`
          : '/';
        window.SRJC_BAJA_SITE_BASE = siteBase;
        document.getElementById('site-favicon').href = `${siteBase}assets/srjc-baja-logo.png`;
      })();
    </script>
  </head>
  <body>
    <header class="header">
      <a class="brand" data-site-home href="/" aria-label="SRJC Baja SAE home">
        <img data-site-logo src="/assets/srjc-baja-logo.png" alt="" width="42" height="42" />
        <span><strong>SRJC BAJA</strong><small>SAE CLUB</small></span>
      </a>
      <a class="home-link" data-site-home href="/">Return home</a>
    </header>
    <main>
      <section class="error" aria-labelledby="error-title">
        <p class="code">404 - Page not found</p>
        <h1 id="error-title">Wrong turn</h1>
        <p>The page you were looking for does not exist or has moved. Head back to the SRJC Baja SAE site.</p>
        <a class="button" data-site-home href="/">Back to SRJC Baja SAE</a>
      </section>
    </main>
    <script>
      (() => {
        const siteBase = window.SRJC_BAJA_SITE_BASE || '/';
        document.querySelectorAll('[data-site-home]').forEach((link) => link.setAttribute('href', siteBase));
        document.querySelectorAll('[data-site-logo]').forEach((image) => image.setAttribute('src', `${siteBase}assets/srjc-baja-logo.png`));
      })();
    </script>
  </body>
</html>
